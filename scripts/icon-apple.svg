<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lead Capture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="0" fill="url(#bg)"/>

  <!-- The card itself, tilted so it reads as a physical object, not a form. -->
  <g transform="rotate(-8 256 256)">
    <rect x="106" y="166" width="300" height="184" rx="20" fill="url(#card)"/>
    <circle cx="160" cy="216" r="22" fill="#cbd5e1"/>
    <rect x="196" y="204" width="150" height="16" rx="8" fill="#334155"/>
    <rect x="196" y="230" width="104" height="12" rx="6" fill="#94a3b8"/>
    <rect x="136" y="270" width="210" height="11" rx="5.5" fill="#cbd5e1"/>
    <rect x="136" y="294" width="164" height="11" rx="5.5" fill="#cbd5e1"/>
  </g>

  <!-- Scan corners, the visual cue that this app reads the card. -->
  <g stroke="#38bdf8" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M96 150 v-26 a20 20 0 0 1 20-20 h26"/>
    <path d="M416 150 v-26 a20 20 0 0 0-20-20 h-26"/>
    <path d="M96 362 v26 a20 20 0 0 0 20 20 h26"/>
    <path d="M416 362 v26 a20 20 0 0 1-20 20 h-26"/>
  </g>

  <!-- The rating dot: the whole point of the app. -->
  <circle cx="382" cy="140" r="34" fill="#0f172a"/>
  <circle cx="382" cy="140" r="23" fill="#ef4444"/>
</svg>
